<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gaafar Crypto Radar</title>
<style>
body{background:#0b1220;color:#eef4ff;font-family:system-ui;margin:0;padding:22px}main{max-width:950px;margin:auto}
h1{color:#55e0c4}.muted{color:#aab9d0}.card{background:#172338;padding:18px;border-radius:16px;margin:16px 0}
input,select{background:#24334d;color:white;border:1px solid #435574;border-radius:8px;padding:10px;margin:5px}
table{width:100%;border-collapse:collapse;direction:ltr;text-align:left}th,td{padding:12px;border-bottom:1px solid #33445e}
.ok{color:#55e0c4}.bad{color:#ff8888}small{color:#aab9d0}
</style></head><body><main>
<h1>📡 Gaafar Crypto Radar</h1><p class="muted">أسعار Binance Spot المباشرة • تحديث كل 15 ثانية</p>
<div class="card"><strong id="status">جاري الاتصال...</strong><p id="updated" class="muted"></p></div>
<div class="card"><input id="search" placeholder="ابحث عن عملة..." aria-label="بحث">
<select id="sort"><option value="symbol">الترتيب الأبجدي</option><option value="change">أعلى ارتفاع 24 ساعة</option><option value="volume">أعلى حجم تداول</option></select></div>
<div class="card" style="overflow-x:auto"><table><thead><tr><th>Pair</th><th>Price (USDT)</th><th>24h %</th><th>24h Volume (USDT)</th></tr></thead><tbody id="rows"><tr><td colspan="4">جاري التحميل...</td></tr></tbody></table></div>
<p><small>الأسعار معلومات سوقية وليست توصية استثمارية. لا يتم عرض بيانات تجريبية عند فشل الاتصال.</small></p>
</main><script>
const rows=document.getElementById('rows'),statusEl=document.getElementById('status');
let coins=[];
function render(){
 const q=document.getElementById('search').value.trim().toUpperCase(),sort=document.getElementById('sort').value;
 let list=coins.filter(c=>c.symbol.includes(q));
 if(sort==='change')list.sort((a,b)=>Number(b.priceChangePercent)-Number(a.priceChangePercent));
 else if(sort==='volume')list.sort((a,b)=>Number(b.quoteVolume)-Number(a.quoteVolume));
 else list.sort((a,b)=>a.symbol.localeCompare(b.symbol));
 rows.replaceChildren();
 if(!list.length){const tr=rows.insertRow();const td=tr.insertCell();td.colSpan=4;td.textContent='لا توجد نتائج';return}
 for(const c of list.slice(0,150)){
 const tr=rows.insertRow(),change=Number(c.priceChangePercent);
 [c.symbol,Number(c.lastPrice).toLocaleString('en-US',{maximumSignificantDigits:9}),change.toFixed(2)+'%',Number(c.quoteVolume).toLocaleString('en-US',{maximumFractionDigits:0})].forEach((v,i)=>{const td=tr.insertCell();td.textContent=v;if(i===2)td.className=change>=0?'ok':'bad'});
 }
}
async function load(){
 try{
 const res=await fetch('https://api.binance.com/api/v3/ticker/24hr',{cache:'no-store'});
 if(!res.ok)throw Error('HTTP '+res.status);
 const data=await res.json();if(!Array.isArray(data))throw Error('Invalid response');
 coins=data.filter(x=>x.symbol.endsWith('USDT')&&Number(x.lastPrice)>0);
 statusEl.textContent='● LIVE CONNECTION — Binance Spot ('+coins.length+' زوج)';
 statusEl.className='ok';document.getElementById('updated').textContent='آخر تحديث: '+new Date().toLocaleTimeString('ar-EG');
 render();
 }catch(e){statusEl.textContent='تعذر الاتصال بـ Binance: '+e.message;statusEl.className='bad';if(!coins.length)rows.innerHTML='<tr><td colspan="4">الأسعار غير متاحة الآن. جرّب تحديث الصفحة لاحقًا.</td></tr>';}
}
document.getElementById('search').addEventListener('input',render);
document.getElementById('sort').addEventListener('change',render);
load();setInterval(load,15000);
</script></body></html>
