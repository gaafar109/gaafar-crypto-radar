name: Deploy Gaafarypto Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
permissions:
  contents: read
concurrency:
  group: gaafarypto-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker and deployment safeguards
        working-directory: worker
        run: |
          node --check index.mjs
          node --test scripts/prepare-config.test.mjs
      - name: Load existing Cloudflare configuration
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare-config.mjs
      - name: Deploy existing Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.generated.json --keep-vars
